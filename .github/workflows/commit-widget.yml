name: commit widget

on:
  schedule:
    - cron: "0 15 * * *"   # 매일 한 번
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 저장소에 커밋할 권한

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6           # v4 → v6
      - uses: actions/setup-python@v6       # v5 → v6
        with:
          python-version: "3.12"
      - run: pip install requests           # requests 설치
      - run: python fetch.py                # 내 코드 실행!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 출입증 넣어 주기
      - run: |                              # 바뀐 SVG를 커밋하고 올리기
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commit-clock.svg commit-sky.svg
          git diff --staged --quiet || git commit -m "update commit widget"
          git push
